<script>
document.addEventListener("DOMContentLoaded", function() {
  // Find the main container header block
  var mainContainer = document.querySelector('.main-container');
  if (mainContainer) {
    // Select all immediate child elements of the main layout container
    var nodes = mainContainer.childNodes;
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      // Identify raw text fragments containing a period/dot that sit above chapter headings
      if (node.nodeType === Node.TEXT_NODE && node.nodeValue.trim() === '.') {
        node.nodeValue = ''; // Vaporize the dot instantly
      }
    }
  }
});
</script>
